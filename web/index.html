  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="Shuffle Master - Randomize anything. Decide instantly.">
  <meta name="color-scheme" content="light">

  <style>
    /* Mobile Native Feel & iOS Polish */
    html, body {
      background-color: #F1E8DA !important;
      color-scheme: light !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      /* Kill 300ms tap delay */
      touch-action: manipulation;
      /* Kill grey/blue tap highlight flash */

      /* Prevent browser pull-to-refresh clash */
      overscroll-behavior: none;
      /* Prevent accidental text selection on button long-press */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
